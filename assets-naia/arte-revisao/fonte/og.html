<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@0..100,0..1,9..144,600;0..100,0..1,9..144,700&family=Ubuntu:wght@400;500;700&family=DM+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #FFFEF8; }

  .card { position: relative; width: 1200px; height: 630px; display: flex; }

  /* Faixa do sistema "contém / varia / seguro" — mesma do card atual. */
  .faixa { position: absolute; inset: 0 0 auto 0; height: 10px; display: flex; z-index: 2; }
  .faixa i { display: block; height: 100%; }
  .faixa .coral { width: 46%; background: #ED6D6B; }
  .faixa .ambar { width: 18%; background: #B0741C; }
  .faixa .verde { flex: 1; background: #46823E; }

  .lado { width: 768px; padding: 74px 56px 44px 72px; display: flex; flex-direction: column; }

  .olho {
    font-family: "DM Mono", monospace; font-weight: 500;
    font-size: 17px; letter-spacing: 0.15em; text-transform: uppercase;
    color: #6E7572; display: flex; align-items: center; gap: 16px;
  }
  .olho::before { content: ""; display: block; width: 34px; height: 2px; background: #ED6D6B; }

  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 600;
    font-variation-settings: "SOFT" 40, "WONK" 1;
    font-size: 78px; line-height: 1.02; letter-spacing: -0.02em;
    color: #9D3B2B; margin-top: 26px;
  }
  h1 .marca {
    color: #ED6D6B;
    background-image: linear-gradient(transparent 62%, #FBDDDA 62%);
    padding-inline: 0.06em;
  }

  .sub {
    font-family: Ubuntu, system-ui, sans-serif; font-size: 25px; line-height: 1.45;
    color: #5C6360; margin-top: 24px; max-width: 560px;
  }

  .credencial {
    margin-top: 62px; border-left: 4px solid #46823E; padding-left: 18px;
  }
  .credencial b {
    display: block; font-family: Ubuntu, sans-serif; font-weight: 700;
    font-size: 25px; color: #2A302F; letter-spacing: -0.005em;
  }
  .credencial span {
    display: block; font-family: "DM Mono", monospace; font-size: 17px;
    color: #6E7572; letter-spacing: 0.05em; margin-top: 3px;
  }

  .dominio {
    font-family: "DM Mono", monospace; font-size: 18px; color: #6E7572;
    letter-spacing: 0.05em; margin-top: auto;
  }

  .foto { position: relative; flex: 1; overflow: hidden; background: #F8E5D6; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  /* Degradê fino para o retrato não bater seco no creme. */
  .foto::after {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 90px;
    background: linear-gradient(90deg, #FFFEF8 0%, rgba(255,254,248,0) 100%);
  }
</style>
<div class="card">
  <div class="faixa"><i class="coral"></i><i class="ambar"></i><i class="verde"></i></div>

  <div class="lado">
    <div class="olho">Nutricionista clínica · CRN-9 22006</div>

    <h1>Dra. Juliana <span class="marca">Maia</span></h1>

    <p class="sub">
      Expert em alergia alimentar. 20 anos de clínica,
      10 dedicados a APLV — e mãe de alérgico.
    </p>

    <div class="credencial">
      <b>+8.000 famílias atendidas</b>
      <span>no Brasil e no exterior · consulta online</span>
    </div>

    <div class="dominio">julianamaianutriaplv.com.br</div>
  </div>

  <div class="foto"><img src="retrato.jpg"></div>
</div>
